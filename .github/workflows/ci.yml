name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 24, `npm ci --ignore-scripts` и нативная сборка node-pty с кэшем по lock-файлу (.github/actions/install/action.yml).
      - uses: ./.github/actions/install
      # Бинарник Electron скачивается лениво, при первом `require('electron')` в тесте (core/test/package.test.ts, playground/test/host-electron.test.ts),
      # и сбой сети (504 с GitHub Releases) красил тест, а не шаг. Кэш по lock-файлу (в нём версия Electron) и скачивание с повтором - до тестов.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Electron (бинарник, кэш и повтор скачивания)
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3 4; do
            node node_modules/electron/install.js && exit 0
            echo "::warning::скачивание Electron не удалось (попытка $attempt из 4)"
            sleep $((attempt * 15))
          done
          exit 1
      - run: npm run build
      # TR-22b (ADR-CH-0019, п. 6): запускатель ограничителя Linux (один файл C, компилятор раннера); тесты ниже (npm test, доверие) используют его, если он собран.
      - name: запускатель Linux (cyborg-confine)
        if: runner.os == 'Linux'
        run: |
          npm run build:confiner
          uname -r
          electron/native/build/linux-*/cyborg-confine --probe
      - run: npm run typecheck
      # ESLint со strictTypeChecked в одном процессе подбирался к 2 ГиБ кучи Node на раннере macOS и падал «JavaScript heap out of memory» (#153).
      # Теперь линт идёт по процессу на пакет (scripts/lint.mjs), пик около 1 ГиБ; 4 ГиБ оставлены запасом на рост самого большого пакета.
      - run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      # Обычный прогон - около минуты; 8 минут - запас, а не срок. Зависший тест падает под своим именем по `--test-timeout` в `npm test`,
      # выше этого предела обрывается шаг, а не вся задача на 15 минут (docs/guide/development/tests-ci.md).
      - name: npm test
        timeout-minutes: 8
        run: npm test
      # Справочник ctx и UiContext (P-04) собран из TSDoc контрактов: правка описаний без `npm run docs:api` красит шаг. Ту же сверку делает сборка сайта (site, `api:check`).
      - name: справочник ctx и UiContext (свежесть)
        run: npm run check:docs-api
      # Публичные типы пакета контрактов изменились - версия пакета выше, чем в ветке назначения (contracts/README.md, «Установка и версии»).
      - name: contracts (снимок API и версия)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          npm run check:contracts -- --base FETCH_HEAD
      - name: contracts (снимок API)
        if: github.event_name != 'pull_request'
        run: npm run check:contracts
      # Шаблон плагина (P-05, templates/plugin): lint, typecheck и test идут в общих шагах выше; здесь - настоящий исполняемый файл автора на шаблоне.
      - name: шаблон плагина (check, build, pack)
        run: |
          node tools/cyborg-plugin/dist/src/cli-bin.js check templates/plugin
          node tools/cyborg-plugin/dist/src/cli-bin.js build templates/plugin --out "$RUNNER_TEMP/template-build"
          node tools/cyborg-plugin/dist/src/cli-bin.js pack "$RUNNER_TEMP/template-build" --out "$RUNNER_TEMP/example.tgz"
          # Происхождение пакета (TR-10): ключ на лету, подпись, воспроизводимый архив с integrity.json и проверка архива так, как её сделает ядро.
          node tools/cyborg-plugin/dist/src/cli-bin.js keygen --out "$RUNNER_TEMP/template-key"
          node tools/cyborg-plugin/dist/src/cli-bin.js sign "$RUNNER_TEMP/template-build" --key "$RUNNER_TEMP/template-key.key"
          node tools/cyborg-plugin/dist/src/cli-bin.js pack "$RUNNER_TEMP/template-build" --out "$RUNNER_TEMP/example-signed.tgz"
          node tools/cyborg-plugin/dist/src/cli-bin.js verify "$RUNNER_TEMP/example-signed.tgz" --key "$RUNNER_TEMP/template-key.pub"
      - name: пример адаптера Electron собирается (README, electron/test/example.test.ts)
        run: node --test electron/test/example.test.ts
      - name: smoke (macOS)
        if: runner.os == 'macOS'
        run: node playground/scripts/smoke.mjs
      # На Linux нужен виртуальный дисплей и запуск без песочницы.
      - name: smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node playground/scripts/smoke.mjs --no-sandbox
      # TR-01, TR-21, TR-22 (docs/research/trust-and-isolation): плагин-нарушитель в хосте стороннего плагина на настоящем Electron в двух режимах - utilityProcess (возврат настройкой) и процесс Node
      # под --permission с ограничителем ОС (Seatbelt на macOS, cyborg-confine на Linux); ожидание по каждой строке - playground/test/real/trust-real-host.test.ts.
      - name: доверие, нарушитель на настоящем Electron: utilityProcess и процесс Node (macOS)
        if: runner.os == 'macOS'
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --test-force-exit --test-timeout=180000 playground/test/real/trust-real-host.test.ts
      - name: доверие, нарушитель на настоящем Electron: utilityProcess и процесс Node (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --test-force-exit --test-timeout=180000 playground/test/real/trust-real-host.test.ts
      # TR-31 (docs/05-verification/views-real-frames.md): виды на настоящем Electron - pushState, чужие фреймы, обход моста, привязка плагина к кадру.
      - name: виды на настоящем Electron (macOS)
        if: runner.os == 'macOS'
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --test-force-exit --test-timeout=240000 playground/test/real/views-real-frames.test.ts
      - name: виды на настоящем Electron (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --test-force-exit --test-timeout=240000 playground/test/real/views-real-frames.test.ts
      # Проба упакованной поставки (P-07, docs/05-verification/bundled-delivery.md): app.asar с dist/delivery, node-pty распакован; на macOS ещё и codesign ad hoc.
      # TR-07: на упакованном приложении проверяются фьюзы (RunAsNode, NODE_OPTIONS, --inspect, OnlyLoadAppFromAsar; на macOS ASAR integrity с подменой app.asar - в CI, переменная CI).
      - name: упакованная поставка (macOS)
        if: runner.os == 'macOS'
        run: node playground/scripts/pack-delivery.mjs
      - name: упакованная поставка (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node playground/scripts/pack-delivery.mjs --no-sandbox
      # Пилот PL-05 (docs/05-verification/spike-monaco-xterm.md): память и время Monaco, кадр sandbox; числа смотрят в журнале шага, шаг не гейт.
      - name: пилот Monaco и xterm (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 6
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON playground/scripts/spike-monaco.mjs memory sandbox
      - name: пилот Monaco и xterm (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 6
        run: xvfb-run --auto-servernum node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON playground/scripts/spike-monaco.mjs memory sandbox --no-sandbox

  # TR-22b: запускатель Linux на двух версиях ядра образов раннера (ubuntu-22.04 и ubuntu-24.04); печатает uname -r и версию ABI Landlock в начале теста.
  # До ядра 6.7 (ABI < 4) сеть держит один seccomp, с 6.7 к нему добавляются правила TCP Landlock; тест различает оба случая по ответу --probe, а не по номеру образа.
  confiner:
    name: ограничитель Linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: сборка запускателя и ядро
        run: |
          uname -r
          node electron/scripts/build-confiner.mjs
          electron/native/build/linux-*/cyborg-confine --probe
      - name: запускатель на настоящем ядре
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test electron/test/confine-linux.test.ts

  # Бюджеты NFR-CH-1001 (P-10): замеры шлюза ctx.os и хостов против порогов из playground/budgets.json. Отдельное задание рядом с `check`,
  # чтобы три прогона замера не съедали его 15 минут. Блокирует только платформа из `gateway.blocking` файла порогов (сейчас Linux);
  # на macOS числа идут в сводку запуска. Шумный раннер: при превышении замер повторяется один раз, красным считается второе превышение подряд.
  budgets:
    name: бюджеты (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Electron (бинарник, кэш и повтор скачивания)
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3 4; do
            node node_modules/electron/install.js && exit 0
            echo "::warning::скачивание Electron не удалось (попытка $attempt из 4)"
            sleep $((attempt * 15))
          done
          exit 1
      - run: npm run build
      - name: запускатель Linux (cyborg-confine)
        if: runner.os == 'Linux'
        run: npm run build:confiner
      - name: замеры и сверка с порогами (spike:gateway, spike:hosts)
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then prefix="xvfb-run --auto-servernum"; extra="--no-sandbox"; else prefix=""; extra=""; fi
          for attempt in 1 2; do
            # Код выхода замеров не берётся: сверка читает JSON и сама красит ошибку прогона (нет файла - ошибка сверки).
            $prefix node playground/scripts/spike-gateway.mjs --json $extra > "$RUNNER_TEMP/gateway.json" || true
            $prefix node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON playground/scripts/spike-hosts.mjs --json $extra > "$RUNNER_TEMP/hosts.json" || true
            if npm run --silent check:budgets -- --gateway "$RUNNER_TEMP/gateway.json" --hosts "$RUNNER_TEMP/hosts.json" --summary "$GITHUB_STEP_SUMMARY"; then
              [ "$attempt" = 1 ] || echo "::warning::бюджет выдержан только со второй попытки: раннер шумит, смотри сводку запуска"
              exit 0
            fi
            echo "::warning::бюджет превышен (попытка $attempt из 2)"
          done
          exit 1
      # TR-21 (критерий 4): тот же бюджет на реальном способе запуска стороннего плагина - процесс Node под --permission и ограничителем ОС (Seatbelt, cyborg-confine); шлюз ctx.os замеряется из плагина в этом хосте.
      - name: замеры и сверка с порогами на хосте стороннего плагина (процесс Node)
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            prefix="xvfb-run --auto-servernum"
            extra="--no-sandbox --confiner-bin=$(ls "$PWD"/electron/native/build/linux-*/cyborg-confine)"
          else
            prefix=""; extra=""
          fi
          for attempt in 1 2; do
            $prefix node playground/scripts/spike-gateway.mjs --json --node-host="$(command -v node)" $extra > "$RUNNER_TEMP/gateway-node.json" || true
            if npm run --silent check:budgets -- --gateway "$RUNNER_TEMP/gateway-node.json" --summary "$GITHUB_STEP_SUMMARY"; then
              [ "$attempt" = 1 ] || echo "::warning::бюджет на хосте Node выдержан только со второй попытки: раннер шумит, смотри сводку запуска"
              exit 0
            fi
            echo "::warning::бюджет на хосте Node превышен (попытка $attempt из 2)"
          done
          exit 1

  # Ссылки и якоря в docs/ и README (P-10): путь с точным регистром и заголовок-цель; покрытие норм и веток сценариев критериями историй (#186) и критериев тестами (#230). Без установки зависимостей и без сети.
  docs-links:
    name: ссылки в docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-docs-links.ts docs README.md
      # Покрытие критериями приёмки (#186): каждая норма дала критерий, каждая ветка сценария покрыта или названа открытой, таблица docs/03-requirements/coverage.md собрана.
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-docs-trace.ts
      # Приёмка: у каждого критерия истории тест с ключом ST-NNNN/k в имени или исключение в docs/05-verification/acceptance.md.
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-acceptance.ts

  # Уязвимости в продакшен-зависимостях (P-10). Дерево берётся из lock-файла, установка не нужна.
  # Пакеты, которые получает потребитель (контракты, ядро, адаптер, тест-кит, cyborg-plugin), и стенд playground (monaco-editor, xterm, node-pty в корне)
  # блокируют при high и выше. monaco-editor 0.57 приносил dompurify с критической уязвимостью, и шаг стенда был только предупреждением (#172): исправление
  # вышло в 0.58.0-dev-20261109 (внутри DOMPurify 3.4.17), стенд закреплён на нём; на стабильный 0.58 перейти, когда он выйдет.
  audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: пакеты для потребителя (блокирует)
        run: |
          failed=0
          for workspace in contracts core electron testing tools/cyborg-plugin; do
            echo "::group::npm audit -w $workspace"
            npm audit --omit=dev --audit-level=high --workspace "$workspace" || failed=1
            echo "::endgroup::"
          done
          exit $failed
      - name: стенд playground (блокирует)
        run: npm audit --omit=dev --audit-level=high
