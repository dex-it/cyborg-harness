name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Публичные типы пакета контрактов изменились - версия пакета выше, чем в ветке назначения (contracts/README.md, «Установка и версии»).
      - name: contracts (снимок API и версия)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          npm run check:contracts -- --base FETCH_HEAD
      - name: contracts (снимок API)
        if: github.event_name != 'pull_request'
        run: npm run check:contracts
      - name: пример адаптера Electron собирается (README, electron/test/example.test.ts)
        run: node --test electron/test/example.test.ts
      - name: smoke (macOS)
        if: runner.os == 'macOS'
        run: node playground/scripts/smoke.mjs
      # На Linux нужен виртуальный дисплей и запуск без песочницы.
      - name: smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node playground/scripts/smoke.mjs --no-sandbox
      # Пилот PL-05 (docs/05-verification/spike-monaco-xterm.md): память и время Monaco, кадр sandbox; числа смотрят в журнале шага, шаг не гейт.
      - name: пилот Monaco и xterm (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 6
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON playground/scripts/spike-monaco.mjs memory sandbox
      - name: пилот Monaco и xterm (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 6
        run: xvfb-run --auto-servernum node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON playground/scripts/spike-monaco.mjs memory sandbox --no-sandbox
